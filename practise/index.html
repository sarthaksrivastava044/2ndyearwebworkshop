<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
    <fieldset id="field">
        <legend>
            ABES 2ND YEAR - A
        </legend>
         <form action="">
            <label for="name">FIRST NAME:</label>
            <input type="text" id="name" placeholder="enter your first name" reqyuired>
            <br><br>
             <label for="lname">LAST NAME:</label>
            <input type="text" id="lname" placeholder="Enter your last name" required>
            <br><br>
            <label for="mail">E-MAIL:</label>
            <input type="text" id="mail" placeholder="enter your email" required>
            <br><br>
            <label for="pass">PASSWORD:</label>
            <input type="password" placeholder="enter your password" required>
            <br><br>
            <label for="gen">GENDER</label>
            <input type="radio" id="male">
            <label for="male">male</label>
             <input type="radio" id="female">
            <label for="female">female</label>
            <br><br>
            <label for="con">CONTACT:</label>
            <br>
            <textarea name="" id="" rows="8" cols="40"></textarea>
            <br><br>
            <label for="">COURSE</label>
            <br><br>
            <input type="radio" id="bca">
            <label for="bca">BCA</label>
            <br>
            <input type="radio" id="btech">
            <label for="btech">BTECH</label>
            <br>
             <input type="radio" id="mba">
            <label for="mba">MBA</label>


         </form>
         <marquee behavior="scroll" direction="left">Please Enter Your Details</marquee>
        
    </fieldset>
    </div>
</body>
</html>
